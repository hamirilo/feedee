[project]
name = "feedee"
version = "0.1.0"
description = "RSS Reader & Bookmark Manager"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "django>=5.2,<6.0",
  "djangorestframework>=3.17,<4.0",
  "beautifulsoup4>=4.14.3",
  "requests>=2.33.0",
  "gunicorn>=23.0",
  "psycopg[binary]>=3.2",
  "nh3>=0.3.4",
  "django-import-export>=4.0",
  "django-ninja>=1.3.0",
  "django-cors-headers>=4.6.0",
  "pyjwt>=2.8.0",
  "passlib[bcrypt]>=1.7",
]

[dependency-groups]
dev = [
  "ruff>=0.4.0",
  "pytest>=8.0",
  "pytest-django>=4.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [
    "ai-platform",
    "*/migrations/*",
    "staticfiles/*",
    "media/*",
]


[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py"]
norecursedirs = ["ai-platform", ".venv", "node_modules", "backend"]


