[project]
name = "feedee"
version = "0.1.0"
description = "RSS Reader & Bookmark Manager"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "django>=5.2,<6.0",
  "djangorestframework>=3.17,<4.0",
  "beautifulsoup4>=4.14.3",
  "requests>=2.33.0",
  "gunicorn>=23.0",
  "psycopg[binary]>=3.2",
  "nh3>=0.3.4",
  "django-import-export>=4.0",
  "django-ninja>=1.3.0",
  "django-cors-headers>=4.6.0",
  "pyjwt>=2.8.0",
  "passlib[bcrypt]>=1.7",
  "whitenoise>=6.8.0",
]

[dependency-groups]
dev = [
  "ruff>=0.4.0",
  "pytest>=8.0",
  "pytest-django>=4.8",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    "backend",
    "frontend",
    "hamirilo-platform",
    "staticfiles",
    "media",
    "node_modules",
    "**/migrations/*.py",
]
extend-exclude = [
    "**/migrations/*.py",
    "node_modules/**",
    "staticfiles/**",
    "media/**",
    "hamirilo-platform/**",
    "backend/**",
    "frontend/**",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # Line too long (handled by ruff format)
    "RUF001",  # Allow ambiguous unicode characters
    "RUF002",
    "RUF003",
    "RUF005",  # Allow list concatenation
    "RUF012",  # Allow mutable class attributes in Django models
    "B904",    # Allow raise without from in except blocks
    "E712",    # Allow equality comparisons to True (useful in SQL expressions)
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
exclude = ["migrations", "staticfiles", "media", "hamirilo-platform"]

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py"]
norecursedirs = ["hamirilo-platform", ".venv", "node_modules", "backend"]


