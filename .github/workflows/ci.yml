name: CI

# PR・マージの必須ゲート。
# ローカルの一括チェックは `just check` / `just test` だが、CI では just を経由せず生コマンドで書く。
#
# 起動条件を `on.paths` で絞っていないのは、required check にしたときに対象外の PR が
# 永久に pending になるのを避けるため。必須にするチェックは集約ジョブ `ci` の 1 つでよい。
#
# 作業ブランチへの push では起動しない。PR と push の両方で起動すると同じコミットを
# 二重に検証することになるため、検証は PR に寄せる (PR を開く前に回したいときは
# workflow_dispatch を使う)。

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 変更検出
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      worker: ${{ steps.filter.outputs.worker }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/**'
              - 'config/**'
              - 'manage.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.typos.toml'
              - 'Justfile'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'static/**'
              - 'templates/**'
              - 'package.json'
              - 'bun.lock'
              - '.bun-version'
              - 'biome.json'
              - 'tailwind.config.js'
              - 'vite.config.js'
              - '.github/workflows/ci.yml'
            worker:
              - 'rss_worker/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
            image:
              - 'Dockerfile'
              - 'docker/**'
              - 'compose*.yaml'
              - 'apps/**'
              - 'config/**'
              - 'frontend/**'
              - 'static/**'
              - 'templates/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'package.json'
              - 'bun.lock'
              - 'rss_worker/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'

  # `just check` の Python 側 + `just test`。
  #
  # 本来は実行環境と同じ PostgreSQL に対して migrate とテストを実行したいが、現在は
  # できない。rssapp の migration 0019 が 7 つのモデルの主キーを bigint から UUID へ
  # AlterField で変換しており、PostgreSQL では
  # `cannot cast type bigint to uuid` で失敗する (SQLite はテーブル再作成で通る)。
  # migration を PostgreSQL でも適用できる形へ直したら、PostgreSQL のサービスコンテナと
  # DATABASE_URL を足してここを切り替える (docs/release.md)。
  backend:
    name: backend (ruff / typos / migration / pytest)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-dummy-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v7

      # uv 本体の版はここで固定する (setup-uv の版は action の版であって uv の版ではない)。
      # Dockerfile の ghcr.io/astral-sh/uv と同じ系列に揃えること。
      - name: uv のセットアップ
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # ロックのとおりに入れる。lock と manifest がずれていたら失敗する。
      - name: Python 依存のインストール
        run: uv sync --frozen

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: typos
        run: uvx typos

      # モデルを変えて migration を作り忘れると、本番の migrate まで誰も気づかない。
      # 開発機には適用済みの DB があるため再現しない。
      - name: migration の欠落検査
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development

      # 設定は pyproject.toml の DJANGO_SETTINGS_MODULE = config.settings.development を使う。
      # DATABASE_URL を渡していないため SQLite で走る (上のコメントを参照)。
      - name: pytest
        run: uv run pytest

      # 本番設定での構成ミスを拾う。ERROR 相当のときだけ失敗する
      # (家庭内 LAN の HTTP 運用で出る security.W00x は警告のまま)。
      - name: deploy check (production settings)
        run: uv run python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: example.com

  frontend:
    name: frontend (biome / build)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # .npmrc の @hamirilo スコープ (GitHub Packages) を読むために必要。
      packages: read
    steps:
      - uses: actions/checkout@v7

      # bun の版はリポジトリの .bun-version が正本。CI はそれを参照するだけにする。
      - name: bun のセットアップ
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Bun キャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # 現在の依存に @hamirilo/* は無いため、この install に認証は要らない。
      # .npmrc が参照する ${GITHUB_TOKEN} の受け渡しは、UI Kit を採用したときに
      # そのまま使えるように残してある (GitHub CLI の予約名と衝突するため、
      # この名前の環境変数はこのステップに閉じる)。403 になる場合は
      # パッケージ設定の "Manage Actions access" にこのリポジトリを追加する
      # (パッケージごとの設定)。docs/release.md を参照。
      - name: 依存のインストール
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: biome
        run: bun run biome check .

      - name: vite build
        run: bun run build

  # RSS 取得ワーカー (Go)。Django 側とは別の成果物なので独立したジョブにする。
  worker:
    name: worker (gofmt / vet / test / build)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Go の版は go.mod が正本 (rss_worker/Dockerfile の golang イメージと揃えること)。
      - name: Go のセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l rss_worker)"
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # 出力名が rss_worker ディレクトリと衝突するため -o で書き出し先を指定する。
      - name: go build
        run: go build -o /tmp/rss-worker ./rss_worker

  # 型チェック・Linter・テストの成功だけでは「配布物が動く」と判断しない。
  # push はせず、イメージが組み上がることと中身があることだけを見る。
  image:
    name: image build
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # トークンは --build-arg ではなく BuildKit の secret で渡す (イメージに残さない)。
      # GitHub Actions キャッシュ (type=gha) を利用してレイヤービルドを大幅高速化する。
      - name: backend イメージを build する
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: feedee:ci
          secrets: |
            github_token=${{ secrets.NPM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # build が成功しても、静的成果物が 1 つも入っていないイメージは配れてしまう。
      - name: 成果物がイメージに入っていることの確認
        run: |
          docker run --rm --entrypoint sh feedee:ci -c '
            set -e
            test -s static/dist/manifest.json
            find static/dist -name "*.js" -print -quit | grep -q .
          '

      - name: rss-worker イメージを build する
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rss_worker/Dockerfile
          load: true
          tags: feedee-rss-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: rss-worker がイメージに入っていることの確認
        run: docker run --rm --entrypoint sh feedee-rss-worker:ci -c 'test -x /usr/local/bin/rss-worker'

  # ruleset へ登録する required check はこのジョブ 1 つだけにする。
  # needs にはすべてのジョブを列挙すること。省いたジョブの失敗は後続の skipped として
  # 伝播し、required check が緑のまま merge できてしまう。
  ci:
    name: ci
    # 先行ジョブが skip・失敗のどちらでも、このジョブは必ず結果を報告する。
    if: always()
    needs: [changes, backend, frontend, worker, image]
    runs-on: ubuntu-latest
    steps:
      - name: 先行ジョブの結果を判定する
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "$RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
