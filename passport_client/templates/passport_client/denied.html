<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログインできません · {{ product }}</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
    main { max-width: 28rem; margin: 0 auto; padding: 3rem 1rem; }
    h1 { font-size: 1.25rem; }
    a { margin-right: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>{{ product }} にログインできません</h1>
    <p>このアカウントには {{ product }} を使う許可がないか、ログインが途中で失敗しました。</p>
    <p>
      <a href="{{ passport_url }}">使えるプロダクトを見る</a>
      <a href="{{ retry_url }}">もう一度ログインする</a>
    </p>
  </main>
</body>
</html>
