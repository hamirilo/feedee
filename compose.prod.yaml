services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feedee}
      POSTGRES_USER: ${POSTGRES_USER:-feedee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feedee}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "if [ ! -f node_modules/.bin/next ] || [ package.json -nt node_modules ]; then npm install; fi && npm run build && npm run start -- -p 3000 -H 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "8082:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://192.168.1.50:8000}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "uv run python manage.py migrate && uv run python manage.py create_admin_user && uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-feedee}:${POSTGRES_PASSWORD:-feedee}@db:5432/${POSTGRES_DB:-feedee}
      - DJANGO_DEBUG=False
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin-password}
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:-change-me-to-a-random-token}
      - SECRET_KEY=${FASTAPI_SECRET_KEY:-change-me-to-a-random-secret-key}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  rss-worker:
    build:
      context: .
      dockerfile: rss_worker/Dockerfile
    env_file:
      - .env
    environment:
      - DJANGO_BASE_URL=http://backend:8000
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:?Set WORKER_API_TOKEN in .env}
      - WORKER_CHECK_INTERVAL_SECONDS=${WORKER_CHECK_INTERVAL_SECONDS:-300}
      - no_proxy=localhost,127.0.0.1,backend,db
      - NO_PROXY=localhost,127.0.0.1,backend,db
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
