{% if messages %}
<div class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
    {% for message in messages %}
    <div class="pointer-events-auto p-3 rounded-lg border shadow-md text-xs font-medium flex items-center justify-between gap-2 {% if message.tags == 'success' %}bg-green-50 border-green-200 text-green-800{% elif message.tags == 'error' %}bg-red-50 border-red-200 text-red-800{% else %}bg-blue-50 border-blue-200 text-blue-800{% endif %}" role="alert">
        <span>{{ message }}</span>
        <button type="button" onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600">×</button>
    </div>
    {% endfor %}
</div>
{% endif %}
