services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feedee}"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "if [ ! -f node_modules/.bin/next ] || [ package.json -nt node_modules ]; then npm install; fi && npm run dev -- -p 3000 -H 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - /app/.next
    ports:
      - "3010:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      backend:
        condition: service_healthy


  backend:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    command: >
      sh -c "python manage.py migrate && python manage.py create_admin_user && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-feedee}:${POSTGRES_PASSWORD:-feedee}@db:5432/${POSTGRES_DB:-feedee}
      - DJANGO_DEBUG=True
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin-password}
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:-change-me-to-a-random-token}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-to-a-random-secret-key}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 15s

  rss-worker:
    build:
      context: .
      dockerfile: rss_worker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_BASE_URL=http://backend:8000
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:-change-me-to-a-random-token}
      - WORKER_CHECK_INTERVAL_SECONDS=${WORKER_CHECK_INTERVAL_SECONDS:-300}
      - no_proxy=localhost,127.0.0.1,backend,db
      - NO_PROXY=localhost,127.0.0.1,backend,db
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontend_node_modules:
  postgres_data:

secrets:
  github_token:
    environment: GITHUB_TOKEN
