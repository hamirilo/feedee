services:
  db:
    image: postgres:16-alpine
    env_file:
      - path: .env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feedee}"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -p 3000 -H 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_started


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - /app/.venv
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-feedee}:${POSTGRES_PASSWORD:-feedee}@db:5432/${POSTGRES_DB:-feedee}
      - DEBUG=true
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin-password}
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:-change-me-to-a-random-token}
    depends_on:
      db:
        condition: service_healthy

  rss-worker:
    build:
      context: .
      dockerfile: rss_worker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_BASE_URL=http://backend:8000
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:-change-me-to-a-random-token}
      - WORKER_CHECK_INTERVAL_SECONDS=${WORKER_CHECK_INTERVAL_SECONDS:-300}
      - no_proxy=localhost,127.0.0.1,backend,db
      - NO_PROXY=localhost,127.0.0.1,backend,db
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
  postgres_data:

